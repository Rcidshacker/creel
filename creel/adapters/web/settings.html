<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creel — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #141619;
    --panel-2: #191c20;
    --line: #2a2d31;
    --line-bright: #3a3e44;
    --ink: #e8e6e1;
    --ink-dim: #8b8f94;
    --amber: #ffb400;
    --amber-dim: #7a5a00;
    --ok: #3ddc84;
    --fail: #ff4757;
    --font-display: 'IBM Plex Sans Condensed', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-mono);
    margin: 0;
    padding: 2.5rem 1.5rem 5rem;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 3px solid var(--amber);
    padding-bottom: 0.85rem;
    margin-bottom: 2rem;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.1rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }
  h1 span { color: var(--amber); }
  .subtitle { font-size: 0.7rem; letter-spacing: 0.22em; color: var(--ink-dim); text-transform: uppercase; }
  a.back {
    font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--line-bright);
  }
  a.back:hover { color: var(--amber); border-color: var(--amber); }

  .field {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 0.9rem 1rem;
    margin-bottom: 0.75rem;
  }
  .field label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim);
    margin-bottom: 0.5rem;
  }
  .field label .note { font-size: 0.62rem; letter-spacing: 0.04em; text-transform: none; color: var(--line-bright); }
  .field input {
    width: 100%;
    background: #060708;
    border: 1px solid var(--line);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    padding: 0.6rem 0.75rem;
  }
  .field input:focus { outline: none; border-color: var(--amber); }
  .field input::placeholder { color: #4a4d51; }
  .field .status { font-size: 0.62rem; margin-top: 0.4rem; }
  .field .status.set { color: var(--ok); }
  .field .status.unset { color: var(--ink-dim); }

  #save {
    background: var(--amber);
    border: none;
    color: #1a1300;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.75rem 1.6rem;
    cursor: pointer;
    transition: transform 150ms ease-out, box-shadow 150ms ease-out;
    box-shadow: 0 2px 0 var(--amber-dim);
    margin-top: 0.5rem;
  }
  #save:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--amber-dim); }
  #save:active { transform: translateY(2px); box-shadow: 0 0 0 var(--amber-dim); }

  #result { margin-top: 1rem; font-size: 0.8rem; }
  #result.ok { color: var(--ok); }
  #result.err { color: var(--fail); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>CR<span>EE</span>L</h1>
      <div class="subtitle">Settings</div>
    </div>
    <a class="back" href="/">&larr; back to console</a>
  </header>

  <form id="form"></form>
  <button id="save" type="button">Save</button>
  <div id="result"></div>
</div>

<script>
const form = document.getElementById('form');
const saveBtn = document.getElementById('save');
const resultEl = document.getElementById('result');

async function load() {
  const resp = await fetch('/settings/data');
  const { fields } = await resp.json();
  form.innerHTML = fields.map(f => `
    <div class="field">
      <label for="${f.key}">${f.label} <span class="note">${f.note}</span></label>
      <input id="${f.key}" name="${f.key}" type="${f.secret ? 'password' : 'text'}"
             placeholder="${f.secret && f.set ? f.value : (f.value || 'not set')}" autocomplete="off" />
      <div class="status ${f.set ? 'set' : 'unset'}">${f.set ? (f.secret ? 'set — ' + f.value : 'set') : 'not set'}</div>
    </div>
  `).join('');
}

saveBtn.addEventListener('click', async () => {
  const body = {};
  form.querySelectorAll('input').forEach((el) => {
    if (el.value.trim() !== '') body[el.name] = el.value.trim();
  });
  if (Object.keys(body).length === 0) {
    resultEl.className = '';
    resultEl.textContent = 'No changes to save (blank fields keep their current value).';
    return;
  }
  saveBtn.disabled = true;
  try {
    const resp = await fetch('/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) throw new Error('save failed');
    resultEl.className = 'ok';
    resultEl.textContent = 'Saved. NVIDIA key changes apply immediately; Firecrawl key and model settings need a server restart.';
    await load();
  } catch (e) {
    resultEl.className = 'err';
    resultEl.textContent = 'Save failed — see server logs.';
  } finally {
    saveBtn.disabled = false;
  }
});

load();
</script>
</body>
</html>
