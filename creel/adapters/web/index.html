<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creel</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  input, select, button { font: inherit; padding: 0.4rem; }
  #url { width: 60%; }
  #trace { border: 1px solid #ccc; padding: 0.5rem; min-height: 4rem; margin-top: 1rem; white-space: pre-wrap; font-size: 0.85rem; }
  .attempt { color: #555; }
  .attempt.ok { color: #0a7a0a; }
  .attempt.failed { color: #b00; }
  #result { margin-top: 1rem; }
  pre { background: #f5f5f5; padding: 0.75rem; overflow-x: auto; }
</style>
</head>
<body>
<h1>Creel</h1>
<p>
  <input id="url" placeholder="https://example.com" />
  <select id="cost_mode"><option value="frugal">frugal</option><option value="reliable">reliable</option></select>
  <button id="go">Fetch</button>
</p>
<div id="trace"></div>
<div id="result"></div>

<script>
const traceEl = document.getElementById('trace');
const resultEl = document.getElementById('result');
const goBtn = document.getElementById('go');

goBtn.addEventListener('click', () => {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const costMode = document.getElementById('cost_mode').value;
  traceEl.textContent = '';
  resultEl.innerHTML = '';
  goBtn.disabled = true;

  const params = new URLSearchParams({ url, cost_mode: costMode, include: 'data,markdown' });
  const source = new EventSource('/scrape/stream?' + params.toString());

  source.addEventListener('attempt_started', (e) => {
    const d = JSON.parse(e.data);
    traceEl.textContent += `-> ${d.engine} ...\n`;
  });
  source.addEventListener('attempt_finished', (e) => {
    const d = JSON.parse(e.data);
    traceEl.textContent += `<- ${d.engine} ${d.status} (${d.duration_ms}ms)${d.failure_class ? ' [' + d.failure_class + ']' : ''}\n`;
  });
  source.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    resultEl.innerHTML = `<h3>${d.status} via ${d.engine_path.join(' -> ') || '(none)'}</h3>` +
      (d.data ? `<pre>${JSON.stringify(d.data, null, 2)}</pre>` : '') +
      (d.markdown ? `<pre>${d.markdown.slice(0, 2000)}</pre>` : '');
    source.close();
    goBtn.disabled = false;
  });
  source.addEventListener('failed', (e) => {
    const d = JSON.parse(e.data);
    resultEl.innerHTML = `<h3>failed</h3><pre>${d.error}</pre>`;
    source.close();
    goBtn.disabled = false;
  });
  source.onerror = () => {
    source.close();
    goBtn.disabled = false;
  };
});
</script>
</body>
</html>
