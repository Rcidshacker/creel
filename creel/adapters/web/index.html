<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #141619;
    --panel-2: #191c20;
    --line: #2a2d31;
    --line-bright: #3a3e44;
    --ink: #e8e6e1;
    --ink-dim: #8b8f94;
    --amber: #ffb400;
    --amber-dim: #7a5a00;
    --ok: #3ddc84;
    --fail: #ff4757;
    --font-display: 'IBM Plex Sans Condensed', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-mono);
    margin: 0;
    padding: 2.5rem 1.5rem 5rem;
    min-height: 100vh;
  }

  .wrap { max-width: 860px; margin: 0 auto; }

  /* ---- Header plate ---- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 3px solid var(--amber);
    padding-bottom: 0.85rem;
    margin-bottom: 2rem;
    animation: rise 500ms cubic-bezier(0.16,1,0.3,1) both;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.1rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }
  h1 span { color: var(--amber); }
  .subtitle {
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  /* ---- Control panel ---- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 1.1rem;
    display: flex;
    gap: 0.75rem;
    align-items: stretch;
    flex-wrap: wrap;
    animation: rise 500ms cubic-bezier(0.16,1,0.3,1) 60ms both;
  }
  #url {
    flex: 1 1 300px;
    background: #060708;
    border: 1px solid var(--line);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    padding: 0.7rem 0.85rem;
  }
  #url:focus { outline: none; border-color: var(--amber); }
  #url::placeholder { color: #4a4d51; }

  .switch {
    display: flex;
    border: 1px solid var(--line);
    background: #060708;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    overflow: hidden;
  }
  .switch button {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-weight: 500;
    padding: 0 0.9rem;
    cursor: pointer;
    transition: background 150ms ease-out, color 150ms ease-out;
  }
  .switch button.active { background: var(--amber-dim); color: var(--amber); }

  #go {
    background: var(--amber);
    border: none;
    color: #1a1300;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 1.6rem;
    cursor: pointer;
    transition: transform 150ms ease-out, box-shadow 150ms ease-out, background 150ms ease-out;
    box-shadow: 0 2px 0 var(--amber-dim);
  }
  #go:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 0 var(--amber-dim); }
  #go:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 var(--amber-dim); }
  #go:disabled { background: #4a4530; color: #8a8060; cursor: progress; box-shadow: none; }

  /* ---- Ladder board ---- */
  .ladder {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-top: 1.5rem;
    animation: rise 500ms cubic-bezier(0.16,1,0.3,1) 120ms both;
  }
  .rung {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: none;
    padding: 0.9rem 0.7rem 0.75rem;
    text-align: center;
  }
  .rung:first-child { border-left: 1px solid var(--line); }
  .rung::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -1px;
    width: 1px;
    height: 60%;
    transform: translateY(-50%);
    background: var(--line-bright);
  }
  .rung:last-child::after { display: none; }
  .rung .tier-num {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--line-bright);
    transition: color 200ms ease-out, text-shadow 200ms ease-out;
  }
  .rung .tier-name {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 0.3rem;
  }
  .rung .tier-status {
    font-size: 0.62rem;
    margin-top: 0.5rem;
    height: 1em;
    color: var(--ink-dim);
  }
  .rung.active .tier-num { color: var(--amber); text-shadow: 0 0 10px rgba(255,180,0,0.6); animation: pulse 1.1s ease-in-out infinite; }
  .rung.active { border-color: var(--amber-dim); }
  .rung.ok .tier-num { color: var(--ok); text-shadow: 0 0 8px rgba(61,220,132,0.4); }
  .rung.ok .tier-status { color: var(--ok); }
  .rung.failed .tier-num { color: var(--fail); }
  .rung.failed .tier-status { color: var(--fail); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Trace readout ---- */
  #trace {
    background: #060708;
    border: 1px solid var(--line);
    border-top: none;
    padding: 0.85rem 1rem;
    min-height: 3.5rem;
    max-height: 14rem;
    overflow-y: auto;
    font-size: 0.78rem;
    line-height: 1.6;
  }
  #trace:empty::before {
    content: 'awaiting request \2014 trace will stream here';
    color: #4a4d51;
  }
  .line { color: var(--ink-dim); }
  .line.ok { color: var(--ok); }
  .line.failed { color: var(--fail); }
  .line .arrow { color: var(--line-bright); margin-right: 0.4rem; }

  /* ---- Result plate ---- */
  #result:not(:empty) {
    margin-top: 1.25rem;
    animation: rise 400ms cubic-bezier(0.16,1,0.3,1) both;
  }
  .badge {
    display: inline-block;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border: 1px solid currentColor;
  }
  .badge.ok { color: var(--ok); }
  .badge.failed, .badge.partial { color: var(--fail); }
  .path {
    color: var(--ink-dim);
    font-size: 0.78rem;
    margin-left: 0.6rem;
  }
  pre {
    background: var(--panel-2);
    border-left: 3px solid var(--amber);
    padding: 0.9rem 1rem;
    margin-top: 0.75rem;
    overflow-x: auto;
    font-size: 0.78rem;
    line-height: 1.5;
    color: var(--ink);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>CR<span>EE</span>L</h1>
      <div class="subtitle">Acquisition Console</div>
    </div>
    <a href="/settings" style="font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line-bright);">Settings &rarr;</a>
  </header>

  <div class="panel">
    <input id="url" placeholder="https://example.com" autocomplete="off" />
    <div class="switch" id="cost_mode" role="group" aria-label="cost mode">
      <button type="button" data-value="frugal" class="active">Frugal</button>
      <button type="button" data-value="reliable">Reliable</button>
    </div>
    <button id="go">Fetch</button>
  </div>

  <div class="ladder" id="ladder">
    <div class="rung" data-tier="scrapling_http"><div class="tier-num">01</div><div class="tier-name">HTTP</div><div class="tier-status">&nbsp;</div></div>
    <div class="rung" data-tier="scrapling_dynamic"><div class="tier-num">02</div><div class="tier-name">Dynamic</div><div class="tier-status">&nbsp;</div></div>
    <div class="rung" data-tier="scrapling_stealth"><div class="tier-num">03</div><div class="tier-name">Stealth</div><div class="tier-status">&nbsp;</div></div>
    <div class="rung" data-tier="remote"><div class="tier-num">04</div><div class="tier-name">Egress</div><div class="tier-status">&nbsp;</div></div>
  </div>
  <div id="trace"></div>
  <div id="result"></div>
</div>

<script>
const traceEl = document.getElementById('trace');
const resultEl = document.getElementById('result');
const goBtn = document.getElementById('go');
const urlInput = document.getElementById('url');
const switchEl = document.getElementById('cost_mode');
const ladder = document.getElementById('ladder');

let costMode = 'frugal';
switchEl.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    switchEl.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    costMode = btn.dataset.value;
  });
});

function rungFor(engine) {
  if (!engine) return null;
  let el = ladder.querySelector(`[data-tier="${engine}"]`);
  if (!el) el = ladder.querySelector('[data-tier="remote"]'); // jina/firecrawl/platform_cli share the last rung
  return el;
}

function resetLadder() {
  ladder.querySelectorAll('.rung').forEach((r) => {
    r.classList.remove('active', 'ok', 'failed');
    r.querySelector('.tier-status').innerHTML = '&nbsp;';
  });
}

goBtn.addEventListener('click', () => {
  const url = urlInput.value.trim();
  if (!url) { urlInput.focus(); return; }
  traceEl.innerHTML = '';
  resultEl.innerHTML = '';
  resetLadder();
  goBtn.disabled = true;

  const params = new URLSearchParams({ url, cost_mode: costMode, include: 'data,markdown' });
  const source = new EventSource('/scrape/stream?' + params.toString());

  source.addEventListener('attempt_started', (e) => {
    const d = JSON.parse(e.data);
    const line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = `<span class="arrow">&gt;</span>${d.engine} ...`;
    traceEl.appendChild(line);
    traceEl.scrollTop = traceEl.scrollHeight;
    const rung = rungFor(d.engine);
    if (rung) { ladder.querySelectorAll('.rung').forEach((r) => r.classList.remove('active')); rung.classList.add('active'); }
  });
  source.addEventListener('attempt_finished', (e) => {
    const d = JSON.parse(e.data);
    const ok = d.status === 'ok';
    const line = document.createElement('div');
    line.className = 'line ' + (ok ? 'ok' : 'failed');
    line.innerHTML = `<span class="arrow">&lt;</span>${d.engine} ${d.status} (${d.duration_ms}ms)${d.failure_class ? ' [' + d.failure_class + ']' : ''}`;
    traceEl.appendChild(line);
    traceEl.scrollTop = traceEl.scrollHeight;
    const rung = rungFor(d.engine);
    if (rung) {
      rung.classList.remove('active');
      rung.classList.add(ok ? 'ok' : 'failed');
      rung.querySelector('.tier-status').textContent = ok ? 'OK' : (d.failure_class || 'FAILED');
    }
  });
  source.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    const statusClass = d.status === 'ok' ? 'ok' : 'failed';
    resultEl.innerHTML = `<span class="badge ${statusClass}">${d.status}</span><span class="path">${d.engine_path.join(' → ') || '(none)'}</span>` +
      (d.data ? `<pre>${JSON.stringify(d.data, null, 2)}</pre>` : '') +
      (d.markdown ? `<pre>${d.markdown.slice(0, 2000).replace(/</g, '&lt;')}</pre>` : '');
    source.close();
    goBtn.disabled = false;
  });
  source.addEventListener('failed', (e) => {
    const d = JSON.parse(e.data);
    resultEl.innerHTML = `<span class="badge failed">failed</span><pre>${(d.error || '').replace(/</g, '&lt;')}</pre>`;
    source.close();
    goBtn.disabled = false;
  });
  source.onerror = () => {
    source.close();
    goBtn.disabled = false;
  };
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') goBtn.click();
});
</script>
</body>
</html>
